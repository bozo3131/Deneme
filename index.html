<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erzurum Portalı</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      border: 1px solid #334155;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { margin-bottom: 10px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Site Yayında!</h1>
    <p>Erzurum'dan herkese açık ilk web sayfası başarıyla yüklendi.</p>
  </div>
</body>
</html>
